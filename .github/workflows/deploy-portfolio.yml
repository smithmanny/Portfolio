name: Deploy Portfolio to Cloudflare

on:
  push:
    branches:
      - staging
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: portfolio-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production:
    name: Build (Production)
    if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: portfolio-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portfolio
        run: pnpm run build
        env:
          EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}

      - name: Upload portfolio build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist-production
          path: dist
          retention-days: 1

  deploy-production:
    name: Deploy portfolio (Production)
    needs: build-production
    if: github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: portfolio-production
    steps:
      - uses: actions/checkout@v4

      - name: Download portfolio build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist-production
          path: dist

      - uses: pnpm/action-setup@v4

      - uses: pnpm/action-setup@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: 4.127.1
          command: deploy -c dist/server/wrangler.json
          workingDirectory: apps/portfolio
