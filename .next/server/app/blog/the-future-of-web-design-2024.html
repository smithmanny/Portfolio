or theme switching */\n:root {\n  --bg-primary: #ffffff;\n  --text-primary: #1a1a1a;\n  --accent: #f97316;\n}\n\n[data-theme=\"dark\"] {\n  --bg-primary: #0a0a0a;\n  --text-primary: #fafafa;\n  --accent: #f97316;\n}\n\nbody {\n  background-color: var(--bg-primary);\n  color: var(--text-primary);\n  transition: background-color 0.3s, color 0.3s;\n}\n```\n\n## Micro-interactions\n\nSubtle animations and micro-interactions are becoming essential for creating engaging user experiences. These small details make interfaces feel alive and responsive.\n\n```css\n/* Subtle hover effect */\n.card {\n  transition: transform 0.2s ease, box-shadow 0.2s ease;\n}\n\n.card:hover {\n  transform: translateY(-4px);\n  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);\n}\n\n/* Button press effect */\n.button {\n  transition: transform 0.1s ease;\n}\n\n.button:active {\n  transform: scale(0.98);\n}\n```\n\n## Variable Fonts\n\nVariable fonts are revolutionizing typography on the web. A single font file can contain multiple weights, widths, and styles:\n\n```css\n/* Using a variable font */\n@font-face {\n  font-family: 'Inter';\n  src: url('/fonts/Inter-Variable.woff2') format('woff2');\n  font-weight: 100 900;\n  font-display: swap;\n}\n\nh1 {\n  font-family: 'Inter', sans-serif;\n  font-weight: 700;\n  font-variation-settings: 'wght' 700, 'slnt' 0;\n}\n\n/* Animate font weight on hover */\n.animated-text {\n  transition: font-variation-settings 0.3s ease;\n}\n\n.animated-text:hover {\n  font-variation-settings: 'wght' 900;\n}\n```\n\n## Bento Grid Layouts\n\nInspired by Japanese bento boxes, this layout trend uses asymmetric grids to create visually interesting and organized content arrangements:\n\n```css\n.bento-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  grid-template-rows: repeat(3, 200px);\n  gap: 1rem;\n}\n\n.bento-item:nth-child(1) {\n  grid-column: span 2;\n  grid-row: span 2;\n}\n\n.bento-item:nth-child(2) {\n  grid-column: span 2;\n}\n\n.bento-item:nth-child(3) {\n  grid-row: span 2;\n}\n```\n\n## Conclusion\n\nThe future of web design is about creating meaningful experiences through intentional choices. Whether it's embracing dark mode, adding subtle micro-interactions, or experimenting with bento grids, the key is to always keep the user at the center of your design decisions.\n    "])</script><script>self.__next_f.push([1,"5:[\"$\",\"main\",null,{\"className\":\"min-h-screen bg-background py-12\",\"children\":[\"$\",\"article\",null,{\"className\":\"container mx-auto max-w-3xl px-4\",\"children\":[[\"$\",\"$Le\",null,{\"href\":\"/#blog\",\"className\":\"mb-8 inline-flex items-center gap-2 text-muted-foreground transition-colors hover:text-accent\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":24,\"height\":24,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-arrow-left h-4 w-4\",\"children\":[[\"$\",\"path\",\"1l729n\",{\"d\":\"m12 19-7-7 7-7\"}],[\"$\",\"path\",\"x3x0zl\",{\"d\":\"M19 12H5\"}],\"$undefined\"]}],\"Back to all posts\"]}],[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"span\",null,{\"data-slot\":\"badge\",\"className\":\"inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 [\u0026\u003esvg]:size-3 gap-1 [\u0026\u003esvg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden border-transparent bg-secondary text-secondary-foreground [a\u0026]:hover:bg-secondary/90 mb-4\",\"children\":\"Design\"}],[\"$\",\"h1\",null,{\"className\":\"mb-6 text-balance text-4xl font-bold tracking-tight md:text-5xl\",\"children\":\"The Future of Web Desi
